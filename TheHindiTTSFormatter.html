<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gen-Cinema | V1 TTS Formatter</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --panel-bg: #14161c;
            --text-main: #d1d5db;
            --accent-blue: #5c8b99;
            --accent-amber: #a37c58;
            --border: #262933;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 40px;
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            font-weight: 300;
            letter-spacing: 3px;
            color: #ffffff;
            text-transform: uppercase;
            border-bottom: 1px solid var(--border);
            padding-bottom: 15px;
        }

        label {
            display: block;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #6b7280;
            margin: 20px 0 10px 0;
        }

        textarea {
            width: 100%;
            background: var(--bg-color);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 15px;
            font-size: 14px;
            border-radius: 4px;
            box-sizing: border-box;
            min-height: 120px;
            resize: vertical;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        .output-box {
            background: #000;
            border-left: 3px solid var(--accent-amber);
            padding: 20px;
            margin-top: 20px;
            font-size: 15px;
            line-height: 1.6;
            min-height: 80px;
        }

        .highlight { color: var(--accent-amber); font-weight: bold; }
        .breath { color: #6b7280; font-style: italic; }
    </style>
</head>
<body>

    <h1>V1.0 TTS Formatter</h1>
    
    <div style="background: var(--panel-bg); padding: 30px; border: 1px solid var(--border); border-radius: 4px;">
        <label>Raw Dialogue Input (Hindustani / English)</label>
        <textarea id="raw-input" placeholder="Type your dialogue here..." oninput="formatAudio()">Dhundh kaafi geyri hai. Tumhari parchai ko bhi nahi dekh sakti main.</textarea>
        
        <label>Generated Audio Prompt (Copy to TTS Node)</label>
        <div class="output-box" id="output-box"></div>
    </div>

    <script>
        function formatAudio() {
            let text = document.getElementById('raw-input').value;
            
            // Basic logic: Replace periods with trailing ellipses and breath markers
            let processed = text.replace(/\./g, " <span class='highlight'>...</span> <span class='breath'>[breath]</span>.");
            
            // Add a soft exhale at the beginning if there's text
            if (processed.trim() !== "") {
                processed = "<span class='breath'>[soft exhale]</span> " + processed;
            }

            document.getElementById('output-box').innerHTML = processed;
        }

        // Run once on load
        formatAudio();
    </script>
</body>
</html>
